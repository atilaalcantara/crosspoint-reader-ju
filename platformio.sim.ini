; Host-only simulator target. This file contains no firmware features; it links
; the existing reader sources against the CrossPoint SDL/FreeRTOS shim.

[env:simulator]
platform = native
lib_ldf_mode = deep+
lib_compat_mode = off
build_src_filter =
  +<*>
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<network/FirmwareBoardTag.cpp>
  -<platform/skip_efuse_blk_check.c>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  -Wno-narrowing
  -Wno-deprecated-declarations
  -DSIMULATOR
  -DCROSSPOINT_EMULATED=1
  -DCROSSPOINT_VERSION=\"dev-simulator\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -Isim-stubs
  -Isrc
  -Ifreeink-sdk/libs/font/FreeInkFont/include
  -Ifreeink-sdk/libs/hardware/MemoryManager/include
lib_ignore = hal, PNGdec, JPEGDEC, WebSockets, MemoryManager
extra_scripts =
  pre:scripts/sim_catchup.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/build_html.py
lib_deps =
  simulator=https://github.com/crosspoint-reader/crosspoint-simulator#047527f0db530d70c04253ccda326a46e11b691e
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  MemoryManager=symlink://freeink-sdk/libs/hardware/MemoryManager
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1

[env:simulator_x4]
extends = env:simulator
build_flags =
  ${env:simulator.build_flags}
  -DSIMULATOR_DEVICE_X4_PRO
